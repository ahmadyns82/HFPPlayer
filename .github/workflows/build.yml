workflows:

  ios-simulator-build:
    name: HFPPlayer – Simulator Build (no signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project HFPPlayer.xcodeproj \
            -scheme HFPPlayer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

  ios-build-ipa:
    name: HFPPlayer – Build Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build unsigned
        script: |
          xcodebuild \
            -project HFPPlayer.xcodeproj \
            -scheme HFPPlayer \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath $CM_BUILD_DIR/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        script: |
          APP=$(find $CM_BUILD_DIR/derived -name "HFPPlayer.app" \
            -path "*Release-iphoneos*" | head -1)
          [ -z "$APP" ] && APP=$(find $CM_BUILD_DIR/derived \
            -name "*.app" -path "*iphoneos*" | head -1)
          echo "App found: $APP"
          mkdir -p $CM_BUILD_DIR/Payload
          cp -r "$APP" $CM_BUILD_DIR/Payload/HFPPlayer.app
          cd $CM_BUILD_DIR
          zip -r HFPPlayer.ipa Payload
          ls -lh HFPPlayer.ipa

    artifacts:
      - $CM_BUILD_DIR/HFPPlayer.ipa

    publishing:
      email:
        recipients:
          - ahmad.yns@hotmail.com
        notify:
          success: true
          failure: true
