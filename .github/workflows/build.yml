name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build iOS archive
        run: |
          xcodebuild \
            -project HFPPlayer.xcodeproj \
            -scheme HFPPlayer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/HFPPlayer.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Package IPA
        run: |
          APP=$(find $RUNNER_TEMP/HFPPlayer.xcarchive -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$APP" $RUNNER_TEMP/Payload/HFPPlayer.app
          cd $RUNNER_TEMP
          zip -r HFPPlayer.ipa Payload/
          ls -lh HFPPlayer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HFPPlayer-IPA
          path: ${{ runner.temp }}/HFPPlayer.ipa
          retention-days: 7
