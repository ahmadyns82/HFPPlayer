workflows:

  ios-simulator-build:
    name: HFPPlayer – Simulator Build (no signing)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project HFPPlayer.xcodeproj \
            -scheme HFPPlayer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color && exit ${PIPESTATUS[0]}

  ios-build-ipa:
    name: HFPPlayer – Build Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Show repo structure
        script: |
          find . -not -p
